name: Verify owned arrow initialization with GCC

on:
  push:
    branches:
      - codex/verify-owned-arrow-uninit

permissions:
  contents: read

jobs:
  gcc:
    if: github.repository == 'KiritoYG/cppcheck'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERIFIED_SOURCE: 52edaae022970e10a904b32d7d0c4d61cc376d34
      CXX: g++
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact source and environment
        run: |
          set -euo pipefail
          mkdir evidence
          git merge-base --is-ancestor "$VERIFIED_SOURCE" HEAD
          git diff --exit-code "$VERIFIED_SOURCE" HEAD -- . ':(exclude).github/workflows/codex-owned-arrow-uninit-verify.yml'
          {
            git rev-parse HEAD
            git diff --name-status "$VERIFIED_SOURCE" HEAD
            g++ --version
            cmake --version
            uname -a
          } | tee evidence/source-and-environment.log

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build libpcre3-dev

      - name: Configure warnings as errors
        run: |
          set -euo pipefail
          cmake -S . -B build-ci -G Ninja -Werror=dev --warn-uninitialized \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG='-O0 -g0' \
            -DCMAKE_CXX_FLAGS='-Werror=range-loop-construct' \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DBUILD_TESTING=ON -DBUILD_GUI=OFF -DBUILD_TRIAGE=OFF \
            -DUSE_MATCHCOMPILER=OFF -DUSE_BOOST=OFF -DHAVE_RULES=ON \
            2>&1 | tee evidence/configure.log
          python3 - <<'PY'
          import json, shlex
          commands = json.load(open('build-ci/compile_commands.json'))
          core = [c for c in commands if c['file'].endswith('/lib/checkuninitvar.cpp')]
          assert core and all('-Werror' in shlex.split(c['command']) for c in core)
          PY

      - name: Build CLI and native suite
        id: build
        run: |
          set -euo pipefail
          cmake --build build-ci --parallel 2 2>&1 | tee evidence/build.log

      - name: Full native tests
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          ./build-ci/bin/testrunner -q 2>&1 | tee evidence/native-tests.log

      - name: Focused initialization and STL regression suites
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          ./build-ci/bin/testrunner TestUninitVar TestStl 2>&1 | tee evidence/owned-arrow-tests.log

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gcc-owned-arrow-uninit-evidence
          path: |
            evidence/
            build-ci/compile_commands.json
          retention-days: 14
